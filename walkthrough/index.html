<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,600;112,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D scene; the HUD floats in the corners like a surveyor's instrument panel */
:root {
  --bg: #1d1915;
  --ink: #f6f0e6;
  --muted: #c4b9a9;
  --panel: rgba(30, 25, 20, 0.74);
  --line: rgba(246, 240, 230, 0.14);
  --accent: #dba65e;
  --accent-ink: #231b12;
  --sage: #9bb985;
  --f-display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --f-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); overflow: hidden; font-family: var(--f-body); -webkit-font-smoothing: antialiased; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: grab; }
#scene:active { cursor: grabbing; }
[hidden] { display: none !important; }

.hud {
  position: fixed; inset: 0; pointer-events: none;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, auto) 1fr minmax(0, auto); grid-template-rows: auto 1fr auto; gap: 12px;
}
.panel {
  pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  backdrop-filter: blur(12px) saturate(1.2); -webkit-backdrop-filter: blur(12px) saturate(1.2);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
}

.brand { grid-column: 1; grid-row: 1; align-self: start; padding: 14px 16px; display: grid; gap: 6px; max-width: 320px; }
.eyebrow { margin: 0; font: 500 11px/1 var(--f-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
.brand h1 { margin: 0; font: 700 26px/1.05 var(--f-display); font-stretch: 112%; letter-spacing: -0.01em; text-wrap: balance; }
.meta { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; color: var(--muted); }
.meta .mono { font-family: var(--f-mono); font-size: 11.5px; }
.here { margin: 4px 0 0; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
.here .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sage); box-shadow: 0 0 0 4px rgba(155, 185, 133, 0.22); flex: none; }
.here .area { font: 400 12px var(--f-mono); color: var(--muted); }

.rooms { grid-column: 3; grid-row: 1 / span 2; align-self: start; width: 236px; max-height: 100%; overflow: auto; }
.rooms summary { list-style: none; cursor: pointer; padding: 12px 14px; font: 600 13px var(--f-body); display: flex; justify-content: space-between; align-items: center; }
.rooms summary::-webkit-details-marker { display: none; }
.rooms summary::after { content: ''; width: 7px; height: 7px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg); margin-top: -4px; transition: transform .2s; }
.rooms[open] summary::after { transform: rotate(-135deg); margin-top: 3px; }
.room-list { display: grid; padding: 0 6px 8px; }
.room-btn {
  appearance: none; border: 0; background: transparent; color: var(--ink); text-align: left; cursor: pointer;
  display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 8px 8px; border-radius: 6px; font: 500 13.5px var(--f-body);
}
.room-btn small { font: 400 11.5px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.room-btn:hover { background: rgba(246, 240, 230, 0.07); }
.room-btn.is-here { background: rgba(219, 166, 94, 0.16); color: var(--accent); }
.room-btn.is-here small { color: var(--accent); }
.group-label { padding: 10px 8px 4px; font: 500 10.5px/1 var(--f-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

.map { grid-column: 1; grid-row: 3; align-self: end; justify-self: start; padding: 8px; display: grid; gap: 6px; }
.map-frame { position: relative; width: 168px; aspect-ratio: 1049 / 1499; max-width: 100%; cursor: crosshair; border-radius: 6px; overflow: hidden; }
.map-frame img { width: 100%; height: 100%; display: block; opacity: 0.92; }
.you { position: absolute; width: 0; height: 0; pointer-events: none; }
.you::before { content: ''; position: absolute; left: -22px; top: -36px; width: 44px; height: 36px; background: conic-gradient(from -32deg at 50% 100%, rgba(219, 166, 94, 0.55) 0 64deg, transparent 64deg); clip-path: polygon(0 0, 100% 0, 50% 100%); }
.you::after { content: ''; position: absolute; left: -6px; top: -6px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; box-sizing: border-box; }
.map-hint { font: 400 11px var(--f-mono); color: var(--muted); padding: 0 2px; }

.modes { grid-column: 2; grid-row: 3; align-self: end; justify-self: center; display: flex; padding: 4px; gap: 4px; }
.modes button {
  appearance: none; border: 0; cursor: pointer; padding: 10px 18px; border-radius: 7px; background: transparent; color: var(--ink);
  font: 600 13.5px var(--f-body); letter-spacing: 0.01em;
}
.modes button:hover { background: rgba(246, 240, 230, 0.08); }
.modes button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.help { grid-column: 3; grid-row: 3; align-self: end; justify-self: end; margin: 0; padding: 10px 12px; font-size: 12px; line-height: 1.6; color: var(--muted); max-width: 236px; }
.help kbd { font: 500 11px var(--f-mono); color: var(--ink); background: rgba(246, 240, 230, 0.1); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }

.stick { position: fixed; left: max(24px, calc(env(safe-area-inset-left, 0px) + 16px)); bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 76px); width: 116px; height: 116px; border-radius: 50%; background: rgba(30, 25, 20, 0.45); border: 1px solid var(--line); pointer-events: auto; touch-action: none; display: grid; place-items: center; }
.stick .knob { width: 48px; height: 48px; border-radius: 50%; background: rgba(246, 240, 230, 0.85); box-shadow: 0 4px 14px rgba(0,0,0,.3); }

.toast { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; padding: 10px 16px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font: 600 15px var(--f-body); opacity: 0; transition: opacity .35s; }
.toast.show { opacity: 1; }

button:focus-visible, summary:focus-visible, .map-frame:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 760px) {
  .hud { grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto 1fr auto; gap: 10px; }
  .brand { grid-column: 1; grid-row: 1; padding: 10px 12px; gap: 4px; }
  .brand h1 { font-size: 20px; }
  .meta { display: none; }
  .here { margin: 0; font-size: 13px; }
  .rooms { grid-column: 2; grid-row: 1; width: auto; max-width: 200px; max-height: 58vh; }
  .rooms summary { padding: 12px; }
  .map { grid-column: 2; grid-row: 2; justify-self: end; align-self: start; padding: 6px; }
  .map-frame { width: 92px; }
  .map-hint { display: none; }
  .modes { grid-column: 1 / -1; grid-row: 4; justify-self: stretch; }
  .modes button { flex: 1; padding: 11px 6px; }
  .help { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
(() => {
'use strict';
// ---------- Plan coordinates ----------
// Everything is laid out in the floor-plan image's pixel space (1049 × 1499) and converted
// to metres at 64 px per metre, centred on the house.
const S = 1 / 64, CX = 528, CY = 745, H = 2.8, T = 14, EYE = 1.6, R = 0.24;
const X = p => (p - CX) * S, Z = p => (p - CY) * S;
const PX = x => x / S + CX, PY = z => z / S + CY;

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer: coarse)').matches;

// ---------- Renderer ----------
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(68, 1, 0.05, 300);
camera.rotation.order = 'YXZ';

// sky gradient
(() => {
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#8fb3d6'); gr.addColorStop(0.55, '#d8e2e6'); gr.addColorStop(1, '#efe6d8');
  g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; scene.background = t;
})();
scene.fog = new THREE.Fog('#e3ddd1', 60, 160);

// ---------- Lights ----------
scene.add(new THREE.HemisphereLight('#fff4e6', '#a8937a', 0.58));
scene.add(new THREE.AmbientLight('#ffffff', 0.12));
const sun = new THREE.DirectionalLight('#ffeed6', 1.35);
sun.position.set(-9, 20, -12);
sun.castShadow = true;
sun.shadow.mapSize.set(coarse ? 1024 : 2048, coarse ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 60 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun);

// ---------- Seeded random ----------
let seed = 7;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

// ---------- Procedural textures ----------
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function tex(size, draw) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding; t.anisotropy = maxAniso;
  return t;
}
function noise(g, s, n, a, col) { for (let i = 0; i < n; i++) { g.fillStyle = `rgba(${col},${rnd() * a})`; g.fillRect(rnd() * s, rnd() * s, 1 + rnd() * 2, 1 + rnd() * 2); } }
function tiles(base, grout, n, vary) {
  return tex(512, (g, s) => {
    const k = s / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const v = (rnd() - 0.5) * vary;
      const c = new THREE.Color(base); c.offsetHSL(0, 0, v);
      g.fillStyle = '#' + c.getHexString(); g.fillRect(i * k, j * k, k, k);
    }
    noise(g, s, 5000, 0.06, '80,70,60');
    g.strokeStyle = grout; g.lineWidth = 3;
    for (let i = 0; i <= n; i++) { g.beginPath(); g.moveTo(i * k, 0); g.lineTo(i * k, s); g.stroke(); g.beginPath(); g.moveTo(0, i * k); g.lineTo(s, i * k); g.stroke(); }
  });
}
const T_TILE = tiles('#e4d4bd', '#cdbaa0', 2, 0.035);      // 2 × 0.6 m tiles
const T_STONE = tiles('#b5b0a9', '#97928b', 2, 0.05);      // 2 × 0.3 m tiles
const T_DECK = tiles('#dcc8a8', '#c4ad89', 2, 0.04);       // 2 × 0.8 m pavers
const T_CONC = tiles('#c9c4bb', '#b8b2a8', 1, 0.0);
const T_WOOD = tex(512, (g, s) => {
  const n = 8, w = s / n;
  for (let i = 0; i < n; i++) {
    let y = -rnd() * s;
    while (y < s) {
      const len = s * (0.45 + rnd() * 0.5);
      const c = new THREE.Color('#9c5f37'); c.offsetHSL((rnd() - 0.5) * 0.02, (rnd() - 0.5) * 0.08, (rnd() - 0.5) * 0.08);
      g.fillStyle = '#' + c.getHexString(); g.fillRect(i * w, y, w, len);
      for (let k = 0; k < 7; k++) { g.strokeStyle = `rgba(60,30,15,${0.08 + rnd() * 0.12})`; g.lineWidth = 1; const x = i * w + rnd() * w; g.beginPath(); g.moveTo(x, y); g.bezierCurveTo(x + 3, y + len * 0.3, x - 3, y + len * 0.6, x + 1, y + len); g.stroke(); }
      g.fillStyle = 'rgba(40,20,10,0.55)'; g.fillRect(i * w, y, w, 2);
      y += len;
    }
    g.fillStyle = 'rgba(40,20,10,0.5)'; g.fillRect(i * w, 0, 2, s);
  }
});
const T_RUG = tex(256, (g, s) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, s, s);
  for (let y = 0; y < s; y += 4) for (let x = 0; x < s; x += 4) { const v = 225 + ((x + y) % 8 ? 0 : 14) - rnd() * 22; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(x, y, 4, 4); }

const std = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.85, metalness: 0 }, o));

  wall: std('#efe8de', { roughness: 0.95 }),
  wallOut: std('#dcd3c6', { roughness: 0.95 }),
  cap: std('#3b3836', { roughness: 0.7 }),
  glass: new THREE.MeshStandardMaterial({ color: '#cfe4ea', roughness: 0.05, metalness: 0.1, transparent: true, opacity: 0.2, depthWrite: false, side: THREE.DoubleSide }),
  frame: std('#2e2c2a', { roughness: 0.5, metalness: 0.4 }),
  wood: std('#8a5734', { roughness: 0.7 }),
  oak: std('#b88353', { roughness: 0.65 }),
  pergola: std('#b9844f', { roughness: 0.7 }),
  cream: std('#ebe3d4'), cream2: std('#f3ede2'),
  yellow: std('#e0bd72'), blue: std('#3c5d9b'), green: std('#88a86c'),
  white: std('#f3f1ec', { roughness: 0.5 }), marble: std('#f1eee9', { roughness: 0.25 }),
  steel: std('#bfc3c6', { roughness: 0.3, metalness: 0.75 }),
  black: std('#1e1e20', { roughness: 0.5 }),
  screen: std('#0c0e12', { roughness: 0.15, metalness: 0.3 }),
  ceramic: std('#fbfbf9', { roughness: 0.2 }),
  pot: std('#d3cbbd', { roughness: 0.9 }), potDark: std('#4a4540'),
  leaf: std('#4c7a37', { flatShading: true }), leaf2: std('#67953f', { flatShading: true }), leaf3: std('#3e6a32', { flatShading: true }),
  shade: std('#f7e9cf', { emissive: '#ffd59a', emissiveIntensity: 0.55 }),
  lightDisc: std('#ffffff', { emissive: '#fff2dc', emissiveIntensity: 0.9 }),
  ceiling: new THREE.MeshLambertMaterial({ color: '#f2ede5', emissive: '#4f4a43', emissiveIntensity: 0.55 }),
  void: std('#2a2622'),
  grill: std('#2b2b2d', { roughness: 0.4, metalness: 0.5 }),
};

const colliders = [];
const floors = [];
const wallsGroup = new THREE.Group(); scene.add(wallsGroup);

function box(x1, y1, x2, y2, y0, h, mat, o = {}) {
  const ax = Math.min(x1, x2), bx = Math.max(x1, x2), ay = Math.min(y1, y2), by = Math.max(y1, y2);
  const m = new THREE.Mesh(new THREE.BoxGeometry((bx - ax) * S, h, (by - ay) * S), mat);
  m.position.set(X((ax + bx) / 2), y0 + h / 2, Z((ay + by) / 2));
  m.castShadow = o.cast !== false; m.receiveShadow = true;
  (o.group || scene).add(m);
  if (o.solid) colliders.push({ x1: X(ax), x2: X(bx), z1: Z(ay), z2: Z(by) });
  return m;
}
function plane(x1, y1, x2, y2, mat, texM, y = 0) {
  const w = (x2 - x1) * S, d = (y2 - y1) * S;
  const g = new THREE.PlaneGeometry(w, d); g.rotateX(-Math.PI / 2);
  const uv = g.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, (uv.getX(i) * w + X(x1)) / texM, (uv.getY(i) * d - Z(y2)) / texM);
  const m = new THREE.Mesh(g, mat); m.position.set(X((x1 + x2) / 2), y, Z((y1 + y2) / 2)); m.receiveShadow = true; scene.add(m);
  return m;
}
const floor = (x1, y1, x2, y2, mat, texM) => floors.push(plane(x1, y1, x2, y2, mat, texM, 0));
const rug = (x1, y1, x2, y2, mat) => plane(x1, y1, x2, y2, mat, 0.5, 0.006);
function cyl(px, py, y0, h, r1, r2, mat, seg = 20, o = {}) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, seg), mat);
  m.position.set(X(px), y0 + h / 2, Z(py)); m.castShadow = o.cast !== false; m.receiveShadow = true; scene.add(m);
  if (o.solid) { const r = Math.max(r1, r2); colliders.push({ x1: X(px) - r, x2: X(px) + r, z1: Z(py) - r, z2: Z(py) + r }); }
  return m;
}

// Walls: run along a line; each piece is [from, to, type]
// W solid · D doorway with lintel · G floor-to-ceiling glass · N window · P terrace parapet
function seg(dir, c, a, b, type) {
  const put = (y0, h, mat, o = {}) => dir === 'h'
    ? box(a, c - T / 2, b, c + T / 2, y0, h, mat, Object.assign({ group: wallsGroup }, o))
    : box(c - T / 2, a, c + T / 2, b, y0, h, mat, Object.assign({ group: wallsGroup }, o));
  const thin = (y0, h, mat, o = {}) => dir === 'h'
    ? box(a, c - 2, b, c + 2, y0, h, mat, Object.assign({ group: wallsGroup }, o))
    : box(c - 2, a, c + 2, b, y0, h, mat, Object.assign({ group: wallsGroup }, o));
  const cap = top => put(top, 0.03, M.cap, { cast: false });
  if (type === 'W') { put(0, H, M.wall, { solid: true }); cap(H); }
  else if (type === 'D') { put(2.15, H - 2.15, M.wall); cap(H); }
  else if (type === 'G') {
    put(0, 0.04, M.frame, { solid: true }); thin(0.04, 2.1, M.glass, { solid: true, cast: false });
    put(2.14, 0.06, M.frame); put(2.2, H - 2.2, M.wall); cap(H);
    const mid = (a + b) / 2;
    if (dir === 'h') box(mid - 2, c - 3, mid + 2, c + 3, 0.04, 2.1, M.frame, { group: wallsGroup });
    else box(c - 3, mid - 2, c + 3, mid + 2, 0.04, 2.1, M.frame, { group: wallsGroup });
  }
  else if (type === 'N') {
    put(0, 0.9, M.wall, { solid: true }); put(0.9, 0.04, M.frame);
    thin(0.94, 1.22, M.glass, { solid: true, cast: false });
    put(2.16, 0.04, M.frame); put(2.2, H - 2.2, M.wall); cap(H);
  }
  else if (type === 'P') { put(0, 1.05, M.wallOut, { solid: true }); put(1.05, 0.05, M.cap); }
}
const run = (dir, c, list) => list.forEach(([a, b, t]) => seg(dir, c, a, b, t || 'W'));

// Furniture orientation helper: f = direction the piece faces (n/s/e/w).
// r(u1,u2,v1,v2): u runs along the piece's length, v from its back edge toward the front.
function frame(x1, y1, x2, y2, f) {
  const hz = f === 's' || f === 'n';
  return {
    L: hz ? x2 - x1 : y2 - y1, D: hz ? y2 - y1 : x2 - x1,
    r: (u1, u2, v1, v2) => hz
      ? (f === 's' ? [x1 + u1, y1 + v1, x1 + u2, y1 + v2] : [x1 + u1, y2 - v2, x1 + u2, y2 - v1])
      : (f === 'e' ? [x1 + v1, y1 + u1, x1 + v2, y1 + u2] : [x2 - v2, y1 + u1, x2 - v1, y1 + u2])
  };
}
const PILLOW = { b: M.blue, g: M.green, y: M.yellow, c: M.cream2 };
function sofa(x1, y1, x2, y2, f, mat = M.cream, pillows = 'ygb') {
  const { L, D, r } = frame(x1, y1, x2, y2, f);
  box(...r(3, L - 3, 3, D - 3), 0, 0.08, M.black);
  box(...r(0, L, 0, D), 0.08, 0.3, mat, { solid: true });
  box(...r(0, L, 0, 13), 0.08, 0.74, mat);
  box(...r(0, 9, 0, D), 0.08, 0.52, mat); box(...r(L - 9, L, 0, D), 0.08, 0.52, mat);
  const seats = Math.max(1, Math.round((L - 18) / 50)), sw = (L - 18) / seats;
  for (let i = 0; i < seats; i++) box(...r(9 + i * sw + 1, 9 + (i + 1) * sw - 1, 13, D - 1), 0.38, 0.1, mat);
  const p = [...pillows];
  p.forEach((k, i) => { const u = 9 + (L - 18) * (i + 0.5) / p.length; box(...r(u - 11, u + 11, 13, 21), 0.48, 0.3, PILLOW[k]); });
}
function chairSet(x1, y1, x2, y2, f, mat) { sofa(x1, y1, x2, y2, f, mat, ''); }
function table(x1, y1, x2, y2, h = 0.42, mat = M.wood, deco = true) {
  box(x1, y1, x2, y2, h - 0.05, 0.05, mat, { solid: true });
  const i = 3; [[x1 + i, y1 + i], [x2 - i - 3, y1 + i], [x1 + i, y2 - i - 3], [x2 - i - 3, y2 - i - 3]].forEach(([a, b]) => box(a, b, a + 3, b + 3, 0, h - 0.05, mat));
  if (deco) { const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2; cyl(cx + 5, cy, h, 0.08, 0.05, 0.04, M.ceramic); bush(cx + 5, cy, h + 0.08, 0.35); box(cx - 14, cy - 6, cx - 2, cy + 6, h, 0.03, M.cream2); }
}
function bush(px, py, y0, s) {
  const g = new THREE.Group(); const mats = [M.leaf, M.leaf2, M.leaf3];
  for (let i = 0; i < 7; i++) {
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.14 * s * (0.7 + rnd() * 0.6), 0), mats[i % 3]);
    const a = rnd() * Math.PI * 2, d = rnd() * 0.14 * s;
    m.position.set(Math.cos(a) * d, 0.12 * s + rnd() * 0.22 * s, Math.sin(a) * d); m.castShadow = true; g.add(m);
  }
  g.position.set(X(px), y0, Z(py)); scene.add(g);
}
function plant(px, py, s = 1) {
  cyl(px, py, 0, 0.38 * s, 0.17 * s, 0.13 * s, M.pot, 18, { solid: s > 0.8 });
  for (let i = 0; i < 9; i++) {
    const m = new THREE.Mesh(new THREE.ConeGeometry(0.06 * s, 0.55 * s * (0.7 + rnd() * 0.5), 4), [M.leaf, M.leaf2, M.leaf3][i % 3]);
    const a = (i / 9) * Math.PI * 2 + rnd(), tilt = 0.35 + rnd() * 0.5;
    m.position.set(X(px) + Math.cos(a) * 0.08 * s, 0.38 * s + 0.22 * s, Z(py) + Math.sin(a) * 0.08 * s);
    m.rotation.set(Math.sin(a) * tilt, 0, -Math.cos(a) * tilt); m.castShadow = true; scene.add(m);
  }
  bush(px, py, 0.4 * s, 1.1 * s);
}
function lamp(px, py, y0) { cyl(px, py, y0, 0.18, 0.04, 0.06, M.ceramic); cyl(px, py, y0 + 0.18, 0.18, 0.08, 0.11, M.shade, 18, { cast: false }); }
function bed(x1, y1, x2, y2, head) {
  const f = head === 'w' ? 'e' : 'w';
  const { L, D, r } = frame(x1, y1, x2, y2, f);
  box(...r(0, L, 0, D), 0.06, 0.28, M.oak, { solid: true });
  box(...r(-8, L + 8, -7, 1), 0, 1.15, M.cream);                 // upholstered headboard
  box(...r(3, L - 3, 2, D - 3), 0.34, 0.2, M.white);              // mattress
  box(...r(1, L - 1, 38, D - 1), 0.42, 0.15, M.cream2);           // duvet
  box(...r(0, L, D - 52, D - 18), 0.44, 0.15, M.green);           // throw
  box(...r(8, L / 2 - 3, 6, 30), 0.54, 0.14, M.white); box(...r(L / 2 + 3, L - 8, 6, 30), 0.54, 0.14, M.white);
  box(...r(14, L / 2 - 8, 26, 36), 0.52, 0.16, M.green); box(...r(L / 2 + 8, L - 14, 26, 36), 0.52, 0.16, M.green);
  [[-34, -4], [L + 4, L + 34]].forEach(([a, b]) => { const n = box(...r(a, b, 1, 30), 0, 0.55, M.oak, { solid: true }); const p = n.position; lamp(PX(p.x), PY(p.z), 0.55); });
}
function wardrobe(x1, y1, x2, y2, h = 2.3, mat = M.oak) {
  box(x1, y1, x2, y2, 0, h, mat, { solid: true });
  const hz = x2 - x1 > y2 - y1, n = Math.max(2, Math.round((hz ? x2 - x1 : y2 - y1) / 50));
  for (let i = 1; i < n; i++) {
    const t = i / n;
    if (hz) { const x = x1 + (x2 - x1) * t; box(x - 0.6, y1 - 0.5, x + 0.6, y2 + 0.5, 0.05, h - 0.1, M.black, { cast: false }); }
    else { const y = y1 + (y2 - y1) * t; box(x1 - 0.5, y - 0.6, x2 + 0.5, y + 0.6, 0.05, h - 0.1, M.black, { cast: false }); }
  }
}

function collide(p) {
  for (let pass = 0; pass < 2; pass++) for (const c of colliders) {
    const nx = Math.max(c.x1, Math.min(p.x, c.x2)), nz = Math.max(c.z1, Math.min(p.z, c.z2));
    const dx = p.x - nx, dz = p.z - nz, d2 = dx * dx + dz * dz;
    if (d2 >= R * R) continue;
    if (d2 > 1e-10) { const d = Math.sqrt(d2); p.x = nx + dx / d * R; p.z = nz + dz / d * R; }
    else { const l = p.x - c.x1, r = c.x2 - p.x, t = p.z - c.z1, b = c.z2 - p.z, m = Math.min(l, r, t, b);
      if (m === l) p.x = c.x1 - R; else if (m === r) p.x = c.x2 + R; else if (m === t) p.z = c.z1 - R; else p.z = c.z2 + R; }
  }
  p.x = Math.max(X(80) + R, Math.min(X(975) - R, p.x)); p.z = Math.max(Z(42) + R, Math.min(Z(1450) - R, p.z));
}

const tmpCam = new THREE.PerspectiveCamera();
tmpCam.rotation.order = 'YXZ';
function orbitPose() {
  const r = orbit.radius * fitFactor();
  tmpCam.position.set(orbit.tx + r * Math.sin(orbit.phi) * Math.sin(orbit.theta), r * Math.cos(orbit.phi), orbit.tz + r * Math.sin(orbit.phi) * Math.cos(orbit.theta));
  tmpCam.lookAt(orbit.tx, 0, orbit.tz);
  return { pos: tmpCam.position.clone(), quat: tmpCam.quaternion.clone() };
}
function walkPose(v) {
  tmpCam.position.set(v.x, EYE, v.z); tmpCam.rotation.set(v.pitch, v.yaw, 0);
  return { pos: tmpCam.position.clone(), quat: tmpCam.quaternion.clone() };
}
function fitFactor() { const a = camera.aspect || 1; return a < 1 ? Math.pow(1 / a, 0.75) : 1; }

function startTween(to, dur, done, arc = true) {
  const from = { pos: camera.position.clone(), quat: camera.quaternion.clone() };
  const dist = from.pos.distanceTo(to.pos);
  tween = { from, to, t: 0, dur: reduced ? 0.001 : dur, done, lift: arc ? Math.min(4, dist * 0.35) : 0 };
}

function enterWalk(v, opts = {}) {
  tour = opts.keepTour ? tour : null;
  mode = opts.keepTour ? 'tour' : 'walk';
  Object.assign(P, { x: v.x, z: v.z, yaw: v.yaw, pitch: v.pitch ?? -0.05 });
  collide(P);
  marker.visible = false;
  setPressed(); setHelp();
  startTween(walkPose(P), opts.dur || 1.6, () => { ceiling.visible = true; if (opts.done) opts.done(); });
}
function enterOverview() {
  tour = null; mode = 'overview'; ceiling.visible = false; marker.visible = true;
  orbit.theta = Math.atan2(camera.position.x - orbit.tx, camera.position.z - orbit.tz) || orbit.theta;
  setPressed(); setHelp(); setHash('');
  startTween(orbitPose(), 1.4, null, false);
}
function goRoom(id, opts = {}) {
  const rm = ROOMS.find(r => r.id === id); if (!rm) return;
  ceiling.visible = false;

}
function setHash(id) { try { history.replaceState(null, '', id ? '#' + id : location.pathname + location.search); } catch (e) { /* hash routing is a convenience */ } }
function startTour() {
  tour = { i: -1, hold: 0, phase: 'move' };

}
function nextStop() {
  if (!tour) return;
  tour.i = (tour.i + 1) % TOUR.length; tour.phase = 'move';
  goRoom(TOUR[tour.i], { keepTour: true, dur: 2.4, done: () => { if (tour) { tour.phase = 'hold'; tour.hold = 0; } } });
}
function takeOver() { if (mode === 'tour') { tour = null; tween = null; ceiling.visible = true; mode = 'walk'; setPressed(); setHelp(); } }

const keys = new Set();
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'shift', 'q', 'e'].includes(k)) {
    keys.add(k);
    if (mode === 'tour') takeOver();
    else if (mode === 'overview' && ['w', 'a', 's', 'd', 'arrowup', 'arrowdown'].includes(k) && !tween) { const rm = roomAt(P.x, P.z); goRoom(rm && P.x ? rm.id : 'living'); }
  }
  if (k === 'o' && mode !== 'overview') enterOverview();
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());

const pointers = new Map();
let downAt = null, pinch0 = 0, radius0 = 0;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId); canvas.focus({ preventScroll: true });
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  downAt = { x: e.clientX, y: e.clientY, t: performance.now() };
  orbit.auto = false;
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); radius0 = orbit.radius; }
  if (mode === 'tour') takeOver();
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (tween && mode !== 'overview') return;
  if (pointers.size === 2 && mode === 'overview') {
    const [a, b] = [...pointers.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch0) orbit.radius = Math.max(9, Math.min(48, radius0 * pinch0 / d));
    return;
  }
  if (mode === 'overview') { tween = null; orbit.theta -= dx * 0.006; orbit.phi = Math.max(0.12, Math.min(1.38, orbit.phi - dy * 0.005)); }
  else { const s = e.pointerType === 'touch' ? 0.006 : 0.0042; P.yaw += dx * s; P.pitch = Math.max(-1.3, Math.min(1.2, P.pitch + dy * s)); }
});
function endPointer(e) {
  const had = pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch0 = 0;
  if (had && downAt && mode === 'overview' && pointers.size === 0) {
    const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
    if (moved < 6 && performance.now() - downAt.t < 500) pickFloor(e);
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => { if (mode !== 'overview') return; e.preventDefault(); orbit.auto = false; tween = null; orbit.radius = Math.max(9, Math.min(48, orbit.radius * Math.exp(e.deltaY * 0.001))); }, { passive: false });

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pickFloor(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(floors, false)[0];
  if (!hit) return;
  const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
  const v = { x: hit.point.x, z: hit.point.z, yaw: yawTo(dir.x, dir.z), pitch: -0.05 };
  collide(v);
  const rm = roomAt(v.x, v.z); if (rm) toast(rm.name);
  ceiling.visible = false;
  enterWalk(v);
}

function mapJump(e) {

  const px = (e.clientX - r.left) / r.width * 1049, py = (e.clientY - r.top) / r.height * 1499;

  tour = null;
  const v = { x: X(px), z: Z(py), yaw: mode === 'overview' ? 0 : P.yaw, pitch: -0.05 };
  collide(v); const rm = roomAt(v.x, v.z); if (rm) { toast(rm.name); setHash(rm.id); }

}

function moveJoy(e) {
  const r = ui.stick.getBoundingClientRect(), max = r.width / 2 - 20;
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const d = Math.hypot(dx, dy); if (d > max) { dx *= max / d; dy *= max / d; }
  joy.x = dx / max; joy.y = dy / max; ui.knob.style.transform = `translate(${dx}px, ${dy}px)`;
}

function resize() {

let currentRoom = null;
function updateHud() {
  const rm = mode === 'overview' && !tween ? null : roomAt(P.x, P.z);
  if (rm !== currentRoom) {
    currentRoom = rm;
    ui.name.textContent = rm ? rm.name : 'Whole house';

const clock = new THREE.Clock();
const fwd = new THREE.Vector3();
function frameLoop() {
  const raw = clock.getDelta(), dt = Math.min(raw, 0.05);

  // wall height eases between dollhouse and full height
  const targetScale = mode === 'overview' ? 0.42 : 1;
  wallScale += (targetScale - wallScale) * Math.min(1, dt * 4);
  wallsGroup.scale.y = wallScale;

  if (tween) {
    tween.t += Math.min(raw, 0.25) / tween.dur;
    const t = Math.min(1, tween.t), e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    camera.position.lerpVectors(tween.from.pos, tween.to.pos, e);
    camera.position.y += Math.sin(Math.PI * e) * tween.lift;
    camera.quaternion.slerpQuaternions(tween.from.quat, tween.to.quat, e);
    if (t >= 1) { const d = tween.done; tween = null; if (d) d(); }
  } else if (mode === 'overview') {
    if (orbit.auto) orbit.theta += dt * 0.06;
    const p = orbitPose(); camera.position.copy(p.pos); camera.quaternion.copy(p.quat);
  } else {
    // walking
    let f = 0, s = 0;
    if (keys.has('w') || keys.has('arrowup')) f += 1;
    if (keys.has('s') || keys.has('arrowdown')) f -= 1;
    if (keys.has('d')) s += 1;
    if (keys.has('a')) s -= 1;
    if (keys.has('arrowleft') || keys.has('q')) P.yaw += dt * 1.8;
    if (keys.has('arrowright') || keys.has('e')) P.yaw -= dt * 1.8;
    if (joy.id !== null) { f -= joy.y; s += joy.x; }
    const len = Math.hypot(f, s);
    if (len > 1) { f /= len; s /= len; }
    const sp = keys.has('shift') ? 3.8 : 2.0;
    const sin = Math.sin(P.yaw), cos = Math.cos(P.yaw);
    const mx = (-sin * f + cos * s) * sp * dt, mz = (-cos * f - sin * s) * sp * dt;
    if (mx || mz) { P.x += mx; collide(P); P.z += mz; collide(P); P.bob += dt * sp * 4.2; }
    if (mode === 'tour' && tour && tour.phase === 'hold') {
      tour.hold += dt; P.yaw += dt * 0.12;
      if (tour.hold > 2.6) nextStop();
    }
    camera.position.set(P.x, EYE + (reduced ? 0 : Math.sin(P.bob) * 0.025), P.z);
    camera.rotation.set(P.pitch, P.yaw, 0);
  }
  // keep the player state in sync while gliding so the minimap follows
  if (tween && mode !== 'overview') { camera.getWorldDirection(fwd); }

  if (marker.visible) { marker.position.set(P.x, 0, P.z); marker.rotation.y = P.yaw; marker.visible = !!(P.x || P.z); if (!marker.visible) marker.visible = true; marker.children.forEach(c => c.visible = !!(P.x || P.z)); }

  updateHud();
  renderer.render(scene, camera);
  requestAnimationFrame(frameLoop);
}

// ---------- Start ----------
ceiling.visible = false; marker.visible = true;
P.x = 0; P.z = 0;
{ const p = orbitPose(); camera.position.copy(p.pos); camera.quaternion.copy(p.quat); }
